<!doctype html>
<meta charset="utf-8">
<!--
  Developer : Abdullah Al Mamun

  Host page for the NGL viewer.

  The viewer's markup and script are still generated by build_ngl_html() in
  app.py; this file exists only to give them a way to talk *back* to Python.
  st.components.v1.html renders a one-way iframe, so anything the user changed
  inside the viewer — a label they placed, a representation they picked — was
  lost on the next Streamlit rerun, which happens on every chat message and
  every widget click. A declared component can call setComponentValue, so those
  edits reach session state and survive.

  The Streamlit component protocol is implemented by hand here rather than
  through the React template, so the app needs no build step: it is three
  postMessage shapes, documented at
  https://docs.streamlit.io/develop/concepts/custom-components/intro
-->
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #root{width:100%;}
</style>
<div id="root"></div>
<script>
(function () {
  var READY = false;
  var lastHtml = null;
  var seq = 0;

  function post(msg) {
    msg.isStreamlitMessage = true;
    window.parent.postMessage(msg, "*");
  }

  function setFrameHeight(h) {
    post({type: "streamlit:setFrameHeight", height: h});
  }

  // Every event carries a monotonic counter. Streamlit replays the last
  // component value on each rerun, so without it Python would re-apply the
  // same label or style change over and over.
  window.paroraEmit = function (event) {
    seq += 1;
    post({
      type: "streamlit:setComponentValue",
      value: Object.assign({n: seq, t: Date.now()}, event),
      dataType: "json"
    });
  };

  // innerHTML does not run <script> tags, so they are re-created in order:
  // external ones are awaited, inline ones evaluated once their dependency
  // (NGL) is on the page.
  function injectScripts(container, done) {
    var scripts = Array.prototype.slice.call(container.querySelectorAll("script"));
    scripts.forEach(function (s) { s.parentNode.removeChild(s); });
    (function next(i) {
      if (i >= scripts.length) { done(); return; }
      var old = scripts[i];
      var el = document.createElement("script");
      if (old.src) {
        el.src = old.src;
        el.onload = function () { next(i + 1); };
        el.onerror = function () {
          console.error("PARORA viewer: failed to load " + old.src);
          next(i + 1);
        };
        document.body.appendChild(el);
      } else {
        el.textContent = old.textContent;
        document.body.appendChild(el);
        next(i + 1);
      }
    })(0);
  }

  function render(html, height) {
    var root = document.getElementById("root");
    root.innerHTML = html;
    injectScripts(root, function () {
      setFrameHeight(height || 700);
    });
    setFrameHeight(height || 700);
  }

  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render") return;
    var args = e.data.args || {};
    var html = args.html || "";
    // Streamlit re-sends render on every rerun. Rebuilding an unchanged scene
    // would drop the camera and reload every structure, so skip it.
    if (html === lastHtml) { setFrameHeight(args.height || 700); return; }
    lastHtml = html;
    render(html, args.height);
  });

  if (!READY) {
    READY = true;
    post({type: "streamlit:componentReady", apiVersion: 1});
    setFrameHeight(700);
  }
})();
</script>
